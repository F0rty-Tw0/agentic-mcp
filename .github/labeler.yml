# Auto-label PRs based on changed files
# Used with actions/labeler

provider:
  - changed-files:
      - any-glob-to-any-file: 'src/config/providers.json'

config:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/config/**'
          - 'providers.schema.json'

core:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/server/**'
          - 'src/tool-registry/**'
          - 'src/session/**'
          - 'src/shared/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

testing:
  - changed-files:
      - any-glob-to-any-file:
          - 'vitest.config*.ts'
          - 'src/**/*.spec.ts'
          - 'src/**/*.test.ts'
